name: Build APK

# Builds the app entirely in the cloud and attaches the APK to a Release.
#
# Trigger it from the Actions tab ("Run workflow"), or push a tag like v1.9.
# No credentials are involved: the APK ships without API keys and each user
# pastes their own into the settings page.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: '发布到 Release（取消勾选则只上传构建产物）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # compileSdk 36 (Android 16) — see app/build.gradle.kts for why not 37.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Assert no credential leaked into the APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then echo "::error::APK not found at $apk"; exit 1; fi
          # Guard the promise made to users: nothing key-shaped ships in the build.
          if strings -a "$apk" | grep -Eq 'sk-[A-Za-z0-9_-]{20,}|sk_tr_[A-Za-z0-9_-]{10,}'; then
            echo "::error::An API key pattern was found inside the APK"; exit 1
          fi
          echo "no key pattern found in the APK"
          ls -l "$apk"

      - name: Report the APK signing identity
        # Informational, NOT a gate. A release must not be blocked by a
        # verification tool being unavailable or by a parsing quirk: the real
        # guarantee is that app/build.gradle.kts hard-codes
        # keystore/release.jks for every release build, and the signature is
        # checked out-of-band after each run. An earlier version of this step
        # tried to fail the build and instead blocked a good release twice.
        continue-on-error: true
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          KEYTOOL="${JAVA_HOME:-}/bin/keytool"
          [ -x "$KEYTOOL" ] || KEYTOOL=keytool
          APKSIGNER=$(command -v apksigner || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
                        -name apksigner -type f 2>/dev/null | sort | tail -1)
          fi
          echo "keytool=$KEYTOOL"
          echo "apksigner=$APKSIGNER"
          # SHA-256 fingerprints are extracted by shape (32 colon-separated hex
          # groups) because keytool's label is localised.
          FP='([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}'
          echo "keystore: $("$KEYTOOL" -list -v -keystore keystore/release.jks \
                -storepass jevjarvis -alias jev 2>/dev/null \
                | grep -oE "$FP" | head -1 | tr 'a-f' 'A-F')"
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "apk     : $("$APKSIGNER" verify --print-certs "$apk" 2>&1 \
                  | grep -oE "$FP" | head -1 | tr 'a-f' 'A-F')"
          else
            echo "apk     : (apksigner unavailable)"
          fi

      - name: Package, checksum and stage
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/jev-assistant-v1.9-qq.apk
          cd dist
          sha256sum jev-assistant-v1.9-qq.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "size=$(du -h jev-assistant-v1.9-qq.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jev-assistant-v1.9-qq
          path: dist/

      - name: Resolve release tag
        id: tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v1.9-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release
        if: steps.tag.outputs.name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: 对话副驾 v1.9（人味提示词 · 深色模式 · 悬浮窗暂停）
          body: |
            ## 安装

            ```bash
            adb install -r jev-assistant-v1.9-qq.apk
            ```

            或把 APK 直接传到手机点击安装（arm64 机型，**Android 9 ~ 17**）。

            > **从本版起可以直接覆盖安装**，不用先卸载。之前每个版本的签名都不一样
            > （云端构建每次在新机器上重新生成调试密钥），所以系统拒绝覆盖、必须卸载重装，
            > 连带把设置和密钥都清掉。现在改用仓库里固定的签名密钥，构建时会断言签名一致。

            ## 首次使用要填两个密钥

            APK 里**不含任何密钥**。打开 App → 设置，填两条：

            | 用途 | 地址 | 模型 | 密钥从哪来 |
            |---|---|---|---|
            | 判断接口 | `https://api.knoxstudio.ai/v1` | `jev-1.13.0` | 你自己的 Knox Studio 密钥 |
            | 回复接口 | `https://tokenrhythm.studio/v1` | `deepseek-flash` | 你自己的 TokenRhythm 密钥 |

            两路预设都已内置为默认值，只需粘两条密钥。填完点「测试判断」「测试回复」确认通了再保存。
            回复模型和 OCR 模型都默认用 `deepseek-flash`（实测支持图片输入）。

            > 设置页有「备份与恢复」：导出一个配置文件存在手机里，卸载重装后导回来，
            > 密钥和所有设置都不用重填。

            ## 这一版改了什么

            - **修复「备份导出后导入什么都没有」**（真 BUG）：导出读的是**已保存**的值，
              而备份卡片在「保存」按钮**上面** —— 你填完密钥往下滚、直接点导出时，
              密钥还在输入框里没保存，导出文件里就是空的。现在导出会先把界面上的
              内容写进配置再导出，并在结果里明确写出「含几个密钥」，空的一眼可见。
              导入成功后界面会自动刷新（以前刷新不了，看着像没生效）。
            - **消息条数可自定义**：以前写死「回复看 10 条、判断看 10 条、面板只显示 6 条」，
              三处不一致 —— 这就是你觉得「只能观测到 6 条」的原因。
              现在设置页可分别设「生成回复看多少条」（默认 30）和「判断意图看多少条」
              （默认 40），范围 3–60；面板顶部会写「共 N 条，显示最近 M 条」，不再偷偷截断。
            - **回复必须结合上下文**：提示词原来只说「最近对话」，并且有一条「一条给具体行动
              或承诺」的策略要求，会把模型往「只答最后一句」上带。现在明确要求
              「必须读懂整段对话在聊什么，不要只针对最后一句、也不要答非所问」，
              用户消息也改成「完整对话（共 N 条，请通读后再回）」。
              实测：同一句结尾「行吧」，在「已答应去取快递」和「对方说自己顺路去」两个
              相反语境下，生成结果分别守住承诺、不重复答应。
            - **修复「别人的消息被识别成我」**：改成**按头像判断**。头像永远贴在发言者
              自己那一侧的外缘，消息再长也不会跑；而之前两版都是拿气泡边沿去比一个
              猜出来的像素列（屏幕宽的 13%、9.2%），长消息必然判反，换个分辨率也会错。
              新逻辑在 720/1080/1440 三种宽度 × 2.0/2.75/3.5 三种密度下 19 项用例全过，
              并且会识别并排除「别人发的截图」这种大方块图片。
            - **修复「别人一发消息，已生成的回复就消失」**：以前每条新消息都会清空面板
              并重新分析；群里刷屏时面板就一直在闪。现在只有**换了会话**才清空，
              同一会话里旧结果保留到新结果出来，标题显示「刷新中…」；正在跑的分析
              也不会被丢弃，而是排队等它结束后用最新消息再跑一次。
            - **默认模型改为 `deepseek-flash`**（回复 + OCR）。
              另外修了一个隐藏问题：改代码里的默认值对**已安装**的 App 无效，因为旧值
              早就存在配置里了 —— 现在加了一次性迁移，只把「恰好等于我们上一版默认值」
              的模型换成新默认，你自己手填的模型绝不会被动。
            - **修复自检按钮**：原来是个没有背景没有边框的纯文字，看上去就是个标签，
              所以「全白只能看到字」。现在是有边框的按钮，结果紧跟在下面。
            - **回复不再有 AI 味**：system 提示词从「你是回复助手」改为**人设身份**
              （「你就是一个普通人在用手机聊天…不是助手，不是 AI」），并采用
              [NeoBot](https://github.com/SuperQuail/NeoBot) 的几条实测有效规则：
              不要回复得太有条理、平淡简短、禁止用（）描述动作、给出「错误→正确」样例。
              实测整洁度（三条回复的长度均匀程度）由 26 降到 10~17，平均 5~8 字。
            - **「目前对话」面板**：悬浮窗顶部显示本次判断依据的最后 6 条消息，
              群聊里显示真实昵称，最新一条加粗并注明「判断针对的就是这句」。
            - **群聊模式**：识别发言人、按「群里的人」而非「对方」判断，
              候选回复按群聊礼节生成（短、不煽情、不乱用亲密称呼），可指定只回复某人。
            - **思考开关**：回复模型默认关闭思考（实测中位 4.5s vs 7.3s，快 40%）。
            - **悬浮窗可拉伸**：右下角把手拖动改尺寸，松手即记住。
            - **兼容 Android 9 ~ 17**：minSdk 28 / targetSdk 36。唯一要 API 30 的
              免 root 截屏只用于 OCR 兜底，低版本会明确提示不支持，其余功能正常。
            - **修复回复乱码**：模型返回 `{"content":…}` 这类对象时不再把 JSON 原文
              显示/填入，并修掉「占位符被排到第一」的 bug。

            ## 校验

            见附件 `SHA256SUMS.txt`。构建过程会断言 APK 内不含密钥。

            ## 已知边界（未在真机复验）

            - **APK 未在真机上跑过**：QQ 采集几何、群昵称绑定、提示词效果均为本地
              等价验证 + 云端编译通过，需装到手机上实测。
            - Android 9/10 上 OCR 兜底不可用（系统无免 root 截屏 API），其余功能正常。
            - 小米 / HyperOS 装完请按主页向导开「无障碍 + 悬浮窗 + 自启动/省电无限制」。

            ## 说明

            基于 [Jev 聊天助手](https://github.com/jev-chat/jev-chat-jarvis) 二次开发（MIT）。
            只读屏幕、不 hook、不改包、不替你发送；程序只把候选回复填进输入框。
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
