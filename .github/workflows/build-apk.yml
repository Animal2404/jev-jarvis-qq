name: Build APK

# Builds the app entirely in the cloud and attaches the APK to a Release.
#
# Trigger it from the Actions tab ("Run workflow"), or push a tag like v1.6.
# No credentials are involved: the APK ships without API keys and each user
# pastes their own into the settings page.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: '发布到 Release（取消勾选则只上传构建产物）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # compileSdk 36 (Android 16) — see app/build.gradle.kts for why not 37.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Assert no credential leaked into the APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then echo "::error::APK not found at $apk"; exit 1; fi
          # Guard the promise made to users: nothing key-shaped ships in the build.
          if strings -a "$apk" | grep -Eq 'sk-[A-Za-z0-9_-]{20,}|sk_tr_[A-Za-z0-9_-]{10,}'; then
            echo "::error::An API key pattern was found inside the APK"; exit 1
          fi
          echo "no key pattern found in the APK"
          ls -l "$apk"

      - name: Package, checksum and stage
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/jev-assistant-v1.6-qq.apk
          cd dist
          sha256sum jev-assistant-v1.6-qq.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "size=$(du -h jev-assistant-v1.6-qq.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jev-assistant-v1.6-qq
          path: dist/

      - name: Resolve release tag
        id: tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v1.6-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release
        if: steps.tag.outputs.name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: 对话副驾 v1.6（Android 9~17 · 群聊 · 云端构建）
          body: |
            ## 安装

            ```bash
            adb install -r jev-assistant-v1.6-qq.apk
            ```

            或把 APK 直接传到手机点击安装（arm64 机型，**Android 9 ~ 17**）。

            ## 首次使用要填两个密钥

            APK 里**不含任何密钥**。打开 App → 设置，填两条：

            | 用途 | 地址 | 模型 | 密钥从哪来 |
            |---|---|---|---|
            | 判断接口 | `https://api.knoxstudio.ai/v1` | `jev-1.13.0` | 你自己的 Knox Studio 密钥 |
            | 回复接口 | `https://tokenrhythm.studio/v1` | `mimo-v2.6-flash` | 你自己的 TokenRhythm 密钥 |

            两路预设都已内置为默认值，只需粘两条密钥。填完点「测试判断」「测试回复」确认通了再保存。

            > 设置页有「备份与恢复」：导出一个配置文件存在手机里，卸载重装后导回来，
            > 密钥和所有设置都不用重填。

            ## 这一版改了什么

            - **回复不再有 AI 味**：system 提示词从「你是回复助手」改为**人设身份**
              （「你就是一个普通人在用手机聊天…不是助手，不是 AI」），并采用
              [NeoBot](https://github.com/SuperQuail/NeoBot) 的几条实测有效规则：
              不要回复得太有条理、平淡简短、禁止用（）描述动作、给出「错误→正确」样例。
              实测整洁度（三条回复的长度均匀程度）由 26 降到 10~17，平均 5~8 字。
            - **修复「别人的消息被识别成我」**：侧别判断原来把气泡边沿与头像列比较，
              长消息必然判反（截图实测：唐天 → 我）。改为与气泡自己的锚点比较，
              8/8 几何用例通过。顺带修复群昵称绑定，群聊模式现在能真正生效。
            - **「目前对话」面板**：悬浮窗顶部显示本次判断依据的最后 6 条消息，
              群聊里显示真实昵称，最新一条加粗并注明「判断针对的就是这句」。
            - **群聊模式**：识别发言人、按「群里的人」而非「对方」判断，
              候选回复按群聊礼节生成（短、不煽情、不乱用亲密称呼），可指定只回复某人。
            - **思考开关**：回复模型默认关闭思考（实测中位 4.5s vs 7.3s，快 40%）。
            - **悬浮窗可拉伸**：右下角把手拖动改尺寸，松手即记住。
            - **兼容 Android 9 ~ 17**：minSdk 28 / targetSdk 36。唯一要 API 30 的
              免 root 截屏只用于 OCR 兜底，低版本会明确提示不支持，其余功能正常。
            - **修复回复乱码**：模型返回 `{"content":…}` 这类对象时不再把 JSON 原文
              显示/填入，并修掉「占位符被排到第一」的 bug。

            ## 校验

            见附件 `SHA256SUMS.txt`。构建过程会断言 APK 内不含密钥。

            ## 已知边界（未在真机复验）

            - **APK 未在真机上跑过**：QQ 采集几何、群昵称绑定、提示词效果均为本地
              等价验证 + 云端编译通过，需装到手机上实测。
            - Android 9/10 上 OCR 兜底不可用（系统无免 root 截屏 API），其余功能正常。
            - 小米 / HyperOS 装完请按主页向导开「无障碍 + 悬浮窗 + 自启动/省电无限制」。

            ## 说明

            基于 [Jev 聊天助手](https://github.com/jev-chat/jev-chat-jarvis) 二次开发（MIT）。
            只读屏幕、不 hook、不改包、不替你发送；程序只把候选回复填进输入框。
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
